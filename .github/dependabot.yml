version: 2

multi-ecosystem-groups:
  wrapper-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: wrapper-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: wrapper-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: bun
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: wrapper-dependencies
    cooldown:
      default-days: 7
      semver-major-days: 14
