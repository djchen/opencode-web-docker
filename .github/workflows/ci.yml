name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-config-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Build Docker image for regression checks
        run: docker build -t opencode-web-docker .

      - name: Run runtime-config regression checks
        run: ./scripts/test-runtime-config.sh

  build-compat-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: v1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build-compat unit tests
        run: bun test

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run oxlint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on root scripts
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh' | grep -v '^opencode/' || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No repository-owned shell scripts found."
            exit 0
          fi

          shellcheck --severity=warning "${files[@]}"
