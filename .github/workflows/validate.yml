name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-config-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build Docker image for regression checks
        run: docker build -t opencode-web-docker .

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run runtime-config regression checks
        run: bun run test:runtime-config

  build-compat-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build-compat unit tests
        run: bun test

      - name: Run upstream compatibility check
        run: bun run test:compat

      - name: Run TypeScript typecheck
        run: bun run typecheck

      - name: Run Biome lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

  actionlint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          inputs: .github/workflows
          min-severity: medium
          min-confidence: medium

  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on root scripts
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh' | grep -v '^opencode/' || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No repository-owned shell scripts found."
            exit 0
          fi

          shellcheck --severity=warning "${files[@]}"
