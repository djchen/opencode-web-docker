[general]
root = "/opt/opencode-web/public"
page-fallback = "/opt/opencode-web/public/index.html"

[[advanced.headers]]
source = "/**"

[advanced.headers.headers]
Cache-Control = "no-store, no-cache, must-revalidate"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' data: http: https: ws: wss:; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'"

[[advanced.headers]]
source = "/assets/**"

[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' data: http: https: ws: wss:; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: https:; media-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'"